_schema-version: 3.3.0
ID: simple-shopping-list
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production --ws-pack
modules:
  - name: simple-shopping-list-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: simple-shopping-list-db
      - name: simple-shopping-list-auth
      - name: simple-shopping-list-destination
  - name: simple-shopping-list
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: simple-shopping-list-auth
      - name: simple-shopping-list-destination
    build-parameters:
      requires:
        - name: simple-shopping-list-ui
          artifacts:
            - './*'
          target-path: resources/simple-shopping-list-ui/webapp
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

  - name: simple-shopping-list-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: simple-shopping-list-db

  - name: simple-shopping-list-ui
    type: html5
    path: app/simple-shopping-list-ui
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []

resources:
  - name: simple-shopping-list-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: simple-shopping-list-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: simple-shopping-list-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
    requires:
      - name: app-api
  - name: simple-shopping-list-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
